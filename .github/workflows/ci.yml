name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm install --legacy-peer-deps || npm install
      - name: Typecheck packages (best effort)
        run: |
          npx tsc -p packages/shared --noEmit || true
          npx tsc -p packages/financial-engine --noEmit || true
        continue-on-error: true
      - name: Unit tests
        run: |
          npm run test -w @cintexa/financial-engine --if-present
          npm run test -w @cintexa/document-processor --if-present
          npm run test -w @cintexa/ai-agents --if-present
        continue-on-error: true
